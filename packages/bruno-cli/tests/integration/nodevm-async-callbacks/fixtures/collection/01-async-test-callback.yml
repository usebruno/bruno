info:
  name: 01-async-test-callback
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/first"

runtime:
  scripts:
    - type: tests
      code: |-
        test('async test with awaited host work passes', async () => {
          const val = await new Promise((resolve) => {
            setTimeout(() => {
              resolve('expected');
            }, 120);
          });
          expect(val).to.equal('expected');
          bru.setVar('asyncTestRan', 'yes');
        });

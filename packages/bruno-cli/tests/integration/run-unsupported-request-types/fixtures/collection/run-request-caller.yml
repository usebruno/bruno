info:
  name: run-request-caller
  type: http
  seq: 3

http:
  method: GET
  url: '{{host}}/run-request-caller'

runtime:
  scripts:
    - type: tests
      code: |-
        const grpcResponse = await bru.runRequest('realtime/grpc-request');
        const wsResponse = await bru.runRequest('realtime/ws-request');

        test('bru.runRequest skips gRPC and WebSocket requests', function () {
          expect(grpcResponse.status).to.equal('skipped');
          expect(wsResponse.status).to.equal('skipped');
        });

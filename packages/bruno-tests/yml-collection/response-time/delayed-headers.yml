info:
  name: delayed headers
  type: http
  seq: 1

http:
  method: GET
  url: "{{localhost}}/api/wait-for/headers?time=1000"
  params:
    - name: time
      value: "1000"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        const WAIT_MS = 1000;
        // The server's timer can fire a few ms before `time` has elapsed by the client's clock.
        const TIMER_SLACK_MS = 50;

        test("response time covers the full wait when headers are held back", () => {
          expect(res.getResponseTime()).to.be.at.least(WAIT_MS - TIMER_SLACK_MS);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

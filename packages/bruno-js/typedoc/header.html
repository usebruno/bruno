      <div id="bru-theme-menu" role="menu" aria-label="Theme" hidden>

          <svg aria-hidden="true"><use href="#bru-theme-icon-os"></use></svg>System

    <a href="#" class="tsd-widget menu" id="tsd-toolbar-menu-trigger" data-toggle="menu" aria-label="Menu">

    </a>
  </div>
  <script>
    // Stores the theme under TypeDoc's own `tsd-theme` key, which its inline script at the top of
    // every page reads, so the next page opens in the chosen theme without a flash.
    (() => {
      const root = document.getElementById('bru-theme');
      const trigger = document.getElementById('bru-theme-trigger');
      const menu = document.getElementById('bru-theme-menu');
      const items = [...menu.querySelectorAll('[data-theme-value]')];

      const syncChecked = () => {
        const current = document.documentElement.dataset.theme;
        for (const item of items) {
          item.setAttribute('aria-checked', String(item.dataset.themeValue === current));
        }
      };

      const setOpen = (open) => {
        menu.hidden = !open;
        trigger.setAttribute('aria-expanded', String(open));
      };

      const applyTheme = (theme) => {
        document.documentElement.dataset.theme = theme;
        try {
          localStorage.setItem('tsd-theme', theme);
        } catch {
          // Storage can be blocked; the choice then lasts for this page only.
        }
        syncChecked();
      };

      trigger.addEventListener('click', () => {
        const open = menu.hidden;
        setOpen(open);
        if (open) (items.find((item) => item.getAttribute('aria-checked') === 'true') || items[0]).focus();
      });

      for (const item of items) {
        item.addEventListener('click', () => {
          applyTheme(item.dataset.themeValue);
          setOpen(false);
          trigger.focus();
        });
      }

      menu.addEventListener('keydown', (event) => {
        const index = items.indexOf(document.activeElement);
        const moves = { ArrowDown: 1, ArrowUp: -1 };
        if (event.key in moves) {
          event.preventDefault();
          items[(index + moves[event.key] + items.length) % items.length].focus();
        }
      });

      root.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !menu.hidden) {
          setOpen(false);
          trigger.focus();
        }
      });

      document.addEventListener('click', (event) => {
        if (!root.contains(event.target)) setOpen(false);
      });

      syncChecked();
    })();
  </script>
</header>

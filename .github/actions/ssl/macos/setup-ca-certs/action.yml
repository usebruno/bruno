name: 'Setup CA Certificates - macOS'
description: 'Setup CA certificates and start test server for custom CA certs tests on macOS'
runs:
  using: 'composite'
  steps:
    - name: Setup CA certificates
      shell: bash
      run: |
        set -euo pipefail
        
        cd tests/ssl/custom-ca-certs/server
        
        echo "running certificate setup"
        node scripts/generate-certs.js

    - name: Start test server
      shell: bash
      run: |
        set -euo pipefail
        
        cd tests/ssl/custom-ca-certs/server
        
        echo "starting server in background"
        node index.js &
        
        echo "server started with PID: $!"

    - name: Setup self-signed test server
      shell: bash
      run: |
        set -euo pipefail

        cd tests/ssl/basic-ssl/server

        echo "generating self-signed certs"
        node scripts/generate-certs.js

        echo "starting self-signed server in background"
        node index.js &

        echo "self-signed server started with PID: $!"

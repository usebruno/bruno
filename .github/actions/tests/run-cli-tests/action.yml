name: 'Run CLI Tests'
description: 'Setup dependencies, start local testbench and run CLI tests'
inputs:
  shell:
    description: 'Shell to use (bash, pwsh)'
    required: false
    default: 'bash'
  experimental_cache_modules:
    description: 'Pass --experimental-cache-modules to bru run (requires developer sandbox)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install Test Collection Dependencies
      shell: ${{ inputs.shell }}
      run: npm ci --prefix packages/bruno-tests/collection

    - name: Install additional-context-root-lib Dependencies
      shell: ${{ inputs.shell }}
      run: npm ci --prefix packages/bruno-tests/additional-context-root-lib

    - name: Run Local Testbench and CLI Tests
      if: inputs.shell != 'pwsh'
      shell: ${{ inputs.shell }}
      run: |
        npm start --workspace=packages/bruno-tests &
        sleep 5
        cd packages/bruno-tests/collection
        EXTRA_ARGS=""
        if [ "${{ inputs.experimental_cache_modules }}" = "true" ]; then
          EXTRA_ARGS="--experimental-cache-modules"
        fi
        node ../../bruno-cli/bin/bru.js run --env Prod --output junit.xml --format junit --sandbox developer $EXTRA_ARGS

    - name: Run Local Testbench and CLI Tests - Windows
      if: inputs.shell == 'pwsh'
      shell: pwsh
      run: |
        $process = Start-Process "npm.cmd" `
          -ArgumentList "start","--workspace=packages/bruno-tests" `
          -NoNewWindow `
          -PassThru

        Start-Sleep -Seconds 5

        if ($process.HasExited) {
          Write-Error "Server exited early"
          exit 1
        }

        cd packages/bruno-tests/collection
        $bruArgs = @("run", "--env", "Prod", "--output", "junit.xml", "--format", "junit", "--sandbox", "developer")
        if ("${{ inputs.experimental_cache_modules }}" -eq "true") {
          $bruArgs += "--experimental-cache-modules"
        }
        & node ../../bruno-cli/bin/bru.js @bruArgs

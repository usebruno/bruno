name: Label new GitHub issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-label:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Skip if the issue was opened with a status label already (e.g. via an issue template)
    if: ${{ !contains(join(github.event.issue.labels.*.name, ' '), 'status-') }}
    steps:
      - name: Add status-new label
        run: gh issue edit "$NUMBER" --add-label "status-new"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}

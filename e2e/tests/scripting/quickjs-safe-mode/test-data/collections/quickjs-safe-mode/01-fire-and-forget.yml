info:
  name: 01-fire-and-forget
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8081/ping

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('lateResult', 'pending');
        bru.sendRequest({ url: 'http://localhost:8081/api/wait-for?time=2000', method: 'GET' }, async (err, res) => {
          bru.setVar('lateResult', 'landed');
        });
    - type: tests
      code: |-
        test("run waits for the fire-and-forget request before finishing", function() {
          expect(res.getStatus()).to.equal(200);
          expect(bru.getVar('lateResult')).to.equal('landed');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

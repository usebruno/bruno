info:
  name: login
  type: http
  seq: 1

http:
  method: GET
  url: "{{authHost}}/query?token=from-auth-api"
  params:
    - name: token
      value: from-auth-api
      type: query

runtime:
  scripts:
    - type: after-response
      code: bru.setVar('leaked', 'yes');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

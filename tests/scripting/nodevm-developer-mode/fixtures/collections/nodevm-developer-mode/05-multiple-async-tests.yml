info:
  name: 05-multiple-async-tests
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8081/ping

runtime:
  scripts:
    - type: tests
      code: |-
        test("sync control", function () {
          expect(1).to.equal(1);
        });

        test("async 100ms", async function () {
          await new Promise((resolve) => setTimeout(resolve, 100));
          expect(true).to.equal(true);
        });

        test("async 300ms", async function () {
          await new Promise((resolve) => setTimeout(resolve, 300));
          expect(true).to.equal(true);
        });

        test("async 500ms", async function () {
          await new Promise((resolve) => setTimeout(resolve, 500));
          expect(true).to.equal(true);
        });

        test("async 700ms", async function () {
          await new Promise((resolve) => setTimeout(resolve, 700));
          expect(true).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

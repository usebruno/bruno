info:
  name: 03-post-response-async
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8081/ping

runtime:
  scripts:
    - type: after-response
      code: |-
        test("post-response sync test (control)", function () {
          expect(res.getStatus()).to.be.a("number");
        });

        test("post-response async test (bug check)", async function () {
          await new Promise((resolve) => setTimeout(resolve, 500));
          expect("ran").to.equal("ran");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

info:
  name: 02-pre-request-async
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8081/ping

runtime:
  scripts:
    - type: before-request
      code: |-
        test("pre-request sync test (control)", function () {
          expect(1).to.equal(1);
        });

        test("pre-request async test (bug check)", async function () {
          await new Promise((resolve) => setTimeout(resolve, 500));
          expect("ran").to.equal("ran");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

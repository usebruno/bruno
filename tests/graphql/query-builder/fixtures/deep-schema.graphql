type Meta {
  key: String!
  value: String
  labels: [String!]!
}

# ───────────── Recursive output (unbounded depth) ─────────────
type TreeNode {
  id: ID!
  depth: Int!
  label: String!
  parent: TreeNode
  children(filter: FilterInput, sort: SortInput, first: Int = 10): [TreeNode!]!
  child(filter: FilterInput): TreeNode
}

type DeepResult {
  success: Boolean!
  message: String
  root: Level01
  echo: JSON
}

type Query {
  "Query the fixed 20-level tree; filter can nest arbitrarily deep"
  deepTree(rootName: String!, filter: FilterInput): Level01
  "Query using the full 20-level input object as an argument"
  deepSearch(input: Level01Input!): Level01
  "Recursive tree with recursive filter + sort"
  tree(rootId: ID!, filter: FilterInput, sort: SortInput): TreeNode
}

type Mutation {
  "Create a 20-level nested structure from one deeply nested variable"
  createDeep(input: Level01Input!): DeepResult!
  "Accepts several deeply nested variables at once"
  createDeepBatch(inputs: [Level01Input!]!, filter: FilterInput, sort: SortInput): [DeepResult!]!
}

schema {
  query: Query
  mutation: Mutation
}

"""
Deep-nesting test schema.
Built to reproduce issues with GraphQL requests whose VARIABLES (and selections)
are nested more than 7 levels deep. Every chain below goes 20 levels.
"""

scalar DateTime
scalar JSON

enum Priority { LOW MEDIUM HIGH CRITICAL }
enum Operator { EQ NEQ GT GTE LT LTE IN CONTAINS STARTS_WITH }
enum SortDirection { ASC DESC }

# ───────────── Shared leaf inputs (appear at every level) ─────────────
input MetaInput {
  key: String!
  value: String
  labels: [String!]
}

input RangeInput {
  min: Float
  max: Float
}

# ───────────── 20-level input chain: Level01Input → … → Level20Input ─────────────
"Input at depth 1"
input Level01Input {
  name: String!
  priority: Priority = MEDIUM
  tags: [String!]
  score: Float
  meta: MetaInput
  range: RangeInput
  "Nested level 2"
  level02: Level02Input
  "List of nested level 2 objects"
  items02: [Level02Input!]
}

"Input at depth 2"
input Level02Input {
  name: String!
  priority: Priority = MEDIUM
  tags: [String!]
  score: Float

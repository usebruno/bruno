# ───────────── Recursive filter input (unbounded depth) ─────────────
input FilterInput {
  field: String
  operator: Operator
  value: String
  values: [String!]
  and: [FilterInput!]
  or: [FilterInput!]
  not: FilterInput
  "Arbitrary-depth child filter"
  child: FilterInput
}

input SortInput {
  field: String!
  direction: SortDirection = ASC
  then: SortInput
}


type Level01 {
  id: ID!
  depth: Int!
  name: String!
  priority: Priority!
  tags: [String!]!
  score: Float
  meta: Meta
  createdAt: DateTime!
  level02(filter: FilterInput, name: String): Level02
  items02(first: Int = 10, filter: FilterInput): [Level02!]!
}


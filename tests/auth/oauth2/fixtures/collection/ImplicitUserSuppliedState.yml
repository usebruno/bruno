info:
  name: ImplicitUserSuppliedState
  type: http
  seq: 4

http:
  method: GET
  url: "{{userinfo_url}}"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: "{{host}}/realms/{{realm}}/protocol/openid-connect/auth"
    callbackUrl: bruno://app/oauth2/callback
    credentials:
      clientId: bruno
    scope: openid
    state: brunoUserState
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

info:
  name: EchoSendReached
  type: grpc
  seq: 17

grpc:
  url: "{{host}}"
  method: /hello.HelloService/SayHello
  methodType: unary
  message:
    - title: message 1
      message: |-
        {
          "greeting": "send-{{sendReached}}"
        }

runtime:
  scripts:
    - type: grpc:after-call-end
      code: |-
        // Cleared once this request has echoed it: the two sandbox modes share this collection, so a
        // value left behind would let the next mode pass without BrokenBeforeMessageSend's hook running.
        bru.setVar('sendReached', '');

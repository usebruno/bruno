info:
  name: LotsOfGreetings
  type: grpc
  seq: 6

grpc:
  url: "{{host}}"
  method: /hello.HelloService/LotsOfGreetings
  methodType: client-streaming
  message:
    - title: message 1
      message: |-
        {
          "greeting": "streamed-1"
        }
    - title: message 2
      message: |-
        {
          "greeting": "streamed-2"
        }
    - title: message 3
      message: |-
        {
          "greeting": "never-streamed"
        }

runtime:
  scripts:
    - type: grpc:after-call-end
      code: |-
        // A client stream sends nothing on connect, so `req.messages` holds what the user actually
        // streamed — the third authored message is deliberately never sent.
        test('the hook sees only the streamed messages', () => {
          expect(bru.grpc.request.messages.count()).to.equal(2);
          expect(bru.grpc.request.messages.get(0).data.greeting).to.equal('streamed-1');
          expect(bru.grpc.request.messages.get(1).data.greeting).to.equal('streamed-2');
        });

        test('server replied once', () => {
          expect(bru.grpc.response.messages.count()).to.equal(1);
        });

        test('call finished with OK', () => {
          expect(bru.grpc.response.statusCode).to.equal(0);
        });

info:
  name: set-env-var
  type: http
  seq: 3

http:
  method: GET
  url: '{{host}}/ping'
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar('base_only', 'base_only_value');
        bru.setEnvVar('session_id', 'script_session');

settings:
  encodeUrl: true

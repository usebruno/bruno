openapi: 3.0.0
info:
  title: Bruno Placeholders API
  version: 1.0.0
servers:
  - url: https://{process.env.HOST}/v1
    description: Prod
    variables:
      process.env.HOST:
        default: '{{process.env.HOST}}'
paths:

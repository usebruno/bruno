# Global environment fixture for reference-variable-type.spec.ts.
# Structure mirrors CASES in ../../../cases.ts — same section order, same
# variable names. Add a case: append a row to CASES and a matching entry here.

name: global-environment

variables:
  # ────────────────────────────────────────────────────────────────────────
  # Target variables — literals the references below point at.
  # ────────────────────────────────────────────────────────────────────────
  - name: globalEnvString
    value: hello
  - name: globalEnvNumber
    value:
      type: number
      data: "300"
  - name: globalEnvBoolean
    value:
      type: boolean
      data: "true"
  - name: globalEnvObject
    value:
      type: object
      data: '{"host":"localhost","port":8080}'
  - name: globalEnvNestedObject
    value:
      type: object
      data: '{"inner":{"stringField":"hello","numberField":300,"booleanField":true}}'
  # Literal dotted-key — a variable *named* `globalEnvObject.port`. Proves the
  # hasOwnProperty(flat-key) branch wins over walking `globalEnvObject`.`port`.
  - name: globalEnvObject.port
    value:
      type: boolean
      data: "true"
  - name: globalEnvObjectWithArray
    value:
      type: object
      data: '{"abc":[2,true]}'

  # ────────────────────────────────────────────────────────────────────────
  # Same-type references (no flag)
  # ────────────────────────────────────────────────────────────────────────
  - name: stringTypeRefersToString
    value: "{{globalEnvString}}"
  - name: numberTypeRefersToNumber
    value:
      type: number
      data: "{{globalEnvNumber}}"
  - name: booleanTypeRefersToBoolean
    value:
      type: boolean
      data: "{{globalEnvBoolean}}"
  - name: objectTypeRefersToObject
    value:
      type: object
      data: "{{globalEnvObject}}"

  # ────────────────────────────────────────────────────────────────────────
  # Nested-path references (dotted walk)
  # ────────────────────────────────────────────────────────────────────────
  - name: stringTypeRefersToNestedString
    value: "{{globalEnvNestedObject.inner.stringField}}"
  - name: numberTypeRefersToNestedNumber
    value:
      type: number
      data: "{{globalEnvNestedObject.inner.numberField}}"
  - name: booleanTypeRefersToNestedBoolean
    value:
      type: boolean
      data: "{{globalEnvNestedObject.inner.booleanField}}"
  - name: numberTypeRefersToNestedString
    value:
      type: number
      data: "{{globalEnvNestedObject.inner.stringField}}"
  - name: booleanTypeRefersToNestedNumber
    value:
      type: boolean
      data: "{{globalEnvNestedObject.inner.numberField}}"

  # ────────────────────────────────────────────────────────────────────────
  # Literal dotted-key reference (hasOwnProperty branch)
  # ────────────────────────────────────────────────────────────────────────
  - name: booleanTypeRefersToDottedKey
    value:
      type: boolean
      data: "{{globalEnvObject.port}}"

  # ────────────────────────────────────────────────────────────────────────
  # Array-index references (numeric path segment)
  # ────────────────────────────────────────────────────────────────────────
  - name: numberTypeRefersToArrayNumber
    value:
      type: number
      data: "{{globalEnvObjectWithArray.abc.0}}"
  - name: booleanTypeRefersToArrayBoolean
    value:
      type: boolean
      data: "{{globalEnvObjectWithArray.abc.1}}"
  - name: objectTypeRefersToArray
    value:
      type: object
      data: "{{globalEnvObjectWithArray.abc}}"
  - name: numberTypeRefersToArrayBoolean
    value:
      type: number
      data: "{{globalEnvObjectWithArray.abc.1}}"
  - name: objectTypeRefersToArrayBoolean
    value:
      type: object
      data: "{{globalEnvObjectWithArray.abc.1}}"

  # ────────────────────────────────────────────────────────────────────────
  # Cross-type references (flagged)
  # ────────────────────────────────────────────────────────────────────────
  - name: numberTypeRefersToString
    value:
      type: number
      data: "{{globalEnvString}}"
  - name: booleanTypeRefersToObject
    value:
      type: boolean
      data: "{{globalEnvObject}}"
  - name: objectTypeRefersToBoolean
    value:
      type: object
      data: "{{globalEnvBoolean}}"

  # ────────────────────────────────────────────────────────────────────────
  # declared:string is permissive — accepts every target type
  # ────────────────────────────────────────────────────────────────────────
  - name: stringTypeRefersToNumber
    value: "{{globalEnvNumber}}"
  - name: stringTypeRefersToArrayBoolean
    value: "{{globalEnvObjectWithArray.abc.1}}"
